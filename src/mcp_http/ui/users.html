<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none';" />
<title>Users</title>
<style>
  :root {
    --bg: #ffffff; --fg: #1b1f23; --muted: #6b7280; --border: #e2e5e9;
    --accent: #2d6cdf; --danger: #c0392b; --success: #1e824c; --radius: 8px; --row-hover: #f4f6f8;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #15181d; --fg: #e7e9ec; --muted: #9aa3ad; --border: #2b2f36; --accent: #6ea2ff; --row-hover: #1e2229; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--fg); font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  table { width: 100%; border-collapse: collapse; margin-bottom: 16px; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--border); font-size: 13px; }
  th { color: var(--muted); font-weight: 600; }
  tr:hover td { background: var(--row-hover); }
  td.actions { white-space: nowrap; }
  select, input[type="text"] { padding: 6px 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--fg); }
  button { padding: 6px 10px; border: none; border-radius: var(--radius); background: var(--accent); color: #fff; font-weight: 600; cursor: pointer; font-size: 12px; }
  button.link { background: none; color: var(--accent); text-decoration: underline; padding: 0; font-weight: 500; }
  button.danger { background: var(--danger); }
  .empty { color: var(--muted); text-align: center; padding: 20px 0; }
  .status { margin-top: 8px; font-size: 12px; color: var(--muted); min-height: 16px; }
  .error { color: var(--danger); }
  .success { color: var(--success); }
  fieldset { border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; }
  legend { padding: 0 6px; color: var(--muted); font-size: 12px; }
  .row { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }
  .row label { flex: 0 0 60px; color: var(--muted); font-size: 12px; }
  .row input, .row select { flex: 1; }
  .confirm-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center; }
  .confirm-box { background: var(--bg); color: var(--fg); border-radius: var(--radius); padding: 16px; width: 240px; }
  .confirm-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }
</style>
</head>
<body>

<table>
  <thead><tr><th>Email</th><th>ID</th><th>Role</th><th class="actions">Actions</th></tr></thead>
  <tbody id="rows"></tbody>
</table>
<div class="status" id="status"></div>

<fieldset>
  <legend>Invite user</legend>
  <div class="row"><label for="email">Email</label><input type="text" id="email" placeholder="name@company.com" /></div>
  <div class="row"><label for="role">Role</label><select id="role"></select></div>
  <button id="invite">Send invite</button>
</fieldset>

<div id="modal-slot"></div>

<script>
const Bridge = (function () {
  if (window.openai && typeof window.openai.callTool === "function") {
    return {
      convention: "openai",
      ready: Promise.resolve(),
      getInitialData: () => window.openai.toolOutput || null,
      // window.openai.callTool resolves to {content, structuredContent, _meta} —
      // unwrap structuredContent so callers get the same envelope shape as the
      // postMessage branch's callTool below (and as toolOutput already is).
      callTool: (name, args) =>
        window.openai.callTool(name, args).then((result) => (result && result.structuredContent) || null),
      onToolResult: () => {},
    };
  }

  // Standard MCP Apps postMessage bridge (spec 2026-01-26,
  // https://apps.extensions.modelcontextprotocol.io). The host will not
  // render or send anything to this iframe until it receives our
  // ui/notifications/initialized notification, so that handshake must
  // complete before anything else happens.
  let nextId = 0;
  const pending = new Map();
  const toolResultHandlers = [];

  function request(method, params) {
    return new Promise((resolve, reject) => {
      const id = ++nextId;
      pending.set(id, { resolve, reject });
      window.parent.postMessage({ jsonrpc: "2.0", id, method, params: params || {} }, "*");
    });
  }

  function notify(method, params) {
    window.parent.postMessage({ jsonrpc: "2.0", method, params: params || {} }, "*");
  }

  window.addEventListener("message", (event) => {
    const msg = event.data;
    if (!msg || typeof msg !== "object" || msg.jsonrpc !== "2.0") return;

    if (msg.id !== undefined && pending.has(msg.id)) {
      const { resolve, reject } = pending.get(msg.id);
      pending.delete(msg.id);
      if (msg.error) reject(msg.error); else resolve(msg.result);
      return;
    }

    if (msg.method === "ui/notifications/tool-result") {
      const data = (msg.params && msg.params.structuredContent) || null;
      toolResultHandlers.forEach((cb) => cb(data));
    }
  });

  const ready = request("ui/initialize", {
    capabilities: {},
    appInfo: { name: "scanova-mcp-ui", version: "1.0.0" },
    protocolVersion: "2026-01-26",
    appCapabilities: { experimental: {}, tools: { listChanged: false }, availableDisplayModes: ["inline"] },
  }).then(() => {
    notify("ui/notifications/initialized", {});
  });

  // Tell the host how big this widget actually is — without this, hosts
  // fall back to a small default iframe size and the content has to be
  // scrolled. Report once ready, then on every subsequent content resize.
  function reportSize() {
    notify("ui/notifications/size-changed", {
      width: document.documentElement.scrollWidth,
      height: document.documentElement.scrollHeight,
    });
  }
  ready.then(reportSize);
  if (typeof ResizeObserver !== "undefined") {
    new ResizeObserver(reportSize).observe(document.documentElement);
  }

  return {
    convention: "postMessage",
    ready,
    getInitialData: () => null,
    callTool: (name, args) =>
      request("tools/call", { name, arguments: args }).then(
        (result) => (result && result.structuredContent) || null
      ),
    onToolResult: (cb) => toolResultHandlers.push(cb),
  };
})();

const rowsEl = document.getElementById("rows");
const statusEl = document.getElementById("status");
const roleSelect = document.getElementById("role");
const modalSlot = document.getElementById("modal-slot");

let roles = [];

function setStatus(text, kind) {
  statusEl.textContent = text || "";
  statusEl.className = "status" + (kind ? " " + kind : "");
}

function handleEnvelope(envelope, onOk) {
  if (envelope && envelope.ok === false) {
    setStatus((envelope.error && envelope.error.message) || JSON.stringify(envelope.error) || "Request failed", "error");
    return;
  }
  onOk(envelope.data);
}

function roleOptions(selected) {
  return roles.map((r) => {
    const value = r.value || r.slug || r.role || r;
    const label = r.label || r.name || value;
    return '<option value="' + value + '"' + (value === selected ? " selected" : "") + ">" + label + "</option>";
  }).join("");
}

function renderRows(items) {
  rowsEl.innerHTML = "";
  if (!items || !items.length) {
    rowsEl.innerHTML = '<tr><td colspan="4" class="empty">No users found</td></tr>';
    return;
  }
  for (const user of items) {
    const tr = document.createElement("tr");
    tr.innerHTML =
      "<td>" + (user.email || "—") + "</td>" +
      "<td>" + user.id + "</td>" +
      '<td><select data-role-for="' + user.id + '">' + roleOptions(user.role) + "</select></td>" +
      '<td class="actions"><button class="link" data-save="' + user.id + '">Save</button> <button class="danger" data-remove="' + user.id + '">Remove</button></td>';
    rowsEl.appendChild(tr);
  }
}

function loadRolesThenUsers() {
  setStatus("Loading…");
  Bridge.callTool("list_user_roles", {})
    .then((envelope) => handleEnvelope(envelope, (data) => {
      roles = (data && (data.results || data)) || [];
      roleSelect.innerHTML = roleOptions(null);
      return Bridge.callTool("list_users", {});
    }))
    .then((envelope) => envelope && handleEnvelope(envelope, (data) => { renderRows(data.results || data); setStatus(""); }))
    .catch(() => setStatus("Could not reach the host", "error"));
}

rowsEl.addEventListener("click", (event) => {
  const saveId = event.target.dataset.save;
  const removeId = event.target.dataset.remove;
  if (saveId) {
    const roleInput = rowsEl.querySelector('[data-role-for="' + saveId + '"]');
    setStatus("Saving…");
    Bridge.callTool("update_user_role", { user_id: saveId, role: roleInput.value })
      .then((envelope) => handleEnvelope(envelope, () => setStatus("Role updated", "success")))
      .catch(() => setStatus("Could not reach the host", "error"));
  }
  if (removeId) {
    modalSlot.innerHTML =
      '<div class="confirm-backdrop"><div class="confirm-box"><p>Remove this user from the account?</p>' +
      '<div class="confirm-actions"><button class="link" id="confirm-cancel">Cancel</button><button class="danger" id="confirm-ok">Remove</button></div></div></div>';
    document.getElementById("confirm-cancel").addEventListener("click", () => { modalSlot.innerHTML = ""; });
    document.getElementById("confirm-ok").addEventListener("click", () => {
      modalSlot.innerHTML = "";
      setStatus("Removing…");
      Bridge.callTool("remove_user", { user_id: removeId })
        .then((envelope) => handleEnvelope(envelope, () => { setStatus("User removed", "success"); loadRolesThenUsers(); }))
        .catch(() => setStatus("Could not reach the host", "error"));
    });
  }
});

document.getElementById("invite").addEventListener("click", () => {
  const email = document.getElementById("email").value.trim();
  const role = roleSelect.value;
  if (!email) { setStatus("Email is required", "error"); return; }
  setStatus("Sending invite…");
  Bridge.callTool("add_user", { email, role })
    .then((envelope) => handleEnvelope(envelope, () => {
      setStatus("Invite sent to " + email, "success");
      document.getElementById("email").value = "";
      loadRolesThenUsers();
    }))
    .catch(() => setStatus("Could not reach the host", "error"));
});

Bridge.ready.then(() => loadRolesThenUsers());
</script>
</body>
</html>
