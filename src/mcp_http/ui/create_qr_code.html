<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none';" />
<title>Create QR Code</title>
<style>
  :root {
    --bg: #ffffff; --fg: #1b1f23; --muted: #6b7280; --border: #e2e5e9;
    --accent: #2d6cdf; --danger: #c0392b; --success: #1e824c; --radius: 8px;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #15181d; --fg: #e7e9ec; --muted: #9aa3ad; --border: #2b2f36; --accent: #6ea2ff; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 16px; background: var(--bg); color: var(--fg); max-width: 380px;
    font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .row { margin-bottom: 12px; }
  .row label { display: block; margin-bottom: 4px; color: var(--muted); }
  .row input[type="text"], .row select, .row textarea {
    width: 100%; padding: 7px 9px; border: 1px solid var(--border); border-radius: 6px;
    background: var(--bg); color: var(--fg); font: inherit;
  }
  textarea { resize: vertical; min-height: 50px; }
  button {
    padding: 8px 14px; border: none; border-radius: var(--radius); background: var(--accent);
    color: #fff; font-weight: 600; cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  .status { margin-top: 10px; font-size: 12px; color: var(--muted); min-height: 16px; }
  .error { color: var(--danger); }
  .success { color: var(--success); }
  .hint { font-size: 11px; color: var(--muted); margin-top: 12px; }
</style>
</head>
<body>

<div class="row">
  <label for="qr_name">Name</label>
  <input type="text" id="qr_name" placeholder="e.g. Storefront QR" />
</div>
<div class="row">
  <label for="category">Content type</label>
  <select id="category">
    <option value="1" data-type="url">Website URL</option>
    <option value="2" data-type="text">Plain text</option>
    <option value="3" data-type="email">Email</option>
    <option value="4" data-type="phoneNumber">Phone number</option>
    <option value="5" data-type="sms">SMS</option>
    <option value="6" data-type="wifi">WiFi</option>
    <option value="7" data-type="vcard">vCard (contact)</option>
  </select>
</div>
<div class="row">
  <label for="qr_type">QR type</label>
  <select id="qr_type">
    <option value="dy">Dynamic (editable after creation)</option>
    <option value="st">Static (fixed content)</option>
  </select>
</div>

<div id="fields"></div>

<button id="create">Create QR code</button>
<div class="status" id="status"></div>
<div class="hint">
  Other content types (Google Map, App Store, Document, Social Media, etc.) aren't covered by this
  form yet — ask in chat and the create_qr_code tool can still build those directly.
</div>

<script>
/* Same dual-convention bridge shim as qr-design.html/create_folder.html — see
   docs/mcp-ui-architecture.md Part 9 (Bridge Contract). */
const Bridge = (function () {
  if (window.openai && typeof window.openai.callTool === "function") {
    return { convention: "openai", callTool: (name, args) => window.openai.callTool(name, args) };
  }
  const pending = new Map();
  window.addEventListener("message", (event) => {
    const msg = event.data;
    if (!msg || typeof msg !== "object") return;
    if (msg.type === "tool-result" && pending.has(msg.requestId)) {
      const { resolve, reject } = pending.get(msg.requestId);
      pending.delete(msg.requestId);
      if (msg.error) reject(msg.error); else resolve(msg.result);
    }
  });
  return {
    convention: "postMessage",
    callTool: (name, args) =>
      new Promise((resolve, reject) => {
        const requestId = "req-" + Date.now() + "-" + Math.random().toString(36).slice(2);
        pending.set(requestId, { resolve, reject });
        window.parent.postMessage({ type: "tool-call", tool: name, args, requestId }, "*");
      }),
  };
})();

// Per-category field definitions + how each maps to the `info` payload shape
// documented in src/mcp_http/schemas.py:CREATE_QR_PARAMS_SCHEMA.
const CATEGORY_FIELDS = {
  url: [{ key: "url", label: "URL", type: "text", placeholder: "https://example.com" }],
  text: [{ key: "text", label: "Text", type: "textarea", placeholder: "Hello world" }],
  email: [
    { key: "email", label: "Email address", type: "text", placeholder: "a@b.com" },
    { key: "subject", label: "Subject", type: "text" },
    { key: "body", label: "Body", type: "textarea" },
  ],
  phoneNumber: [{ key: "phone", label: "Phone number", type: "text", placeholder: "+1 555 0100" }],
  sms: [
    { key: "phone", label: "Phone number", type: "text" },
    { key: "message", label: "Message", type: "textarea" },
  ],
  wifi: [
    { key: "ssid", label: "Network name (SSID)", type: "text" },
    { key: "password", label: "Password", type: "text" },
    { key: "authentication", label: "Security", type: "select", options: ["WPA", "WEP", "nopass"] },
  ],
  vcard: [
    { key: "first_name", label: "First name", type: "text" },
    { key: "last_name", label: "Last name", type: "text" },
    { key: "mobile", label: "Mobile", type: "text" },
    { key: "job_title", label: "Job title", type: "text" },
  ],
};

const fieldsEl = document.getElementById("fields");
const categorySelect = document.getElementById("category");

function currentType() {
  return categorySelect.selectedOptions[0].dataset.type;
}

function renderFields() {
  const type = currentType();
  const defs = CATEGORY_FIELDS[type] || [];
  fieldsEl.innerHTML = "";
  for (const def of defs) {
    const row = document.createElement("div");
    row.className = "row";
    const label = document.createElement("label");
    label.textContent = def.label;
    label.htmlFor = "f_" + def.key;
    row.appendChild(label);

    let input;
    if (def.type === "textarea") {
      input = document.createElement("textarea");
    } else if (def.type === "select") {
      input = document.createElement("select");
      for (const opt of def.options) {
        const o = document.createElement("option");
        o.value = opt; o.textContent = opt;
        input.appendChild(o);
      }
    } else {
      input = document.createElement("input");
      input.type = "text";
      if (def.placeholder) input.placeholder = def.placeholder;
    }
    input.id = "f_" + def.key;
    input.dataset.key = def.key;
    row.appendChild(input);
    fieldsEl.appendChild(row);
  }
}
categorySelect.addEventListener("change", renderFields);
renderFields();

const statusEl = document.getElementById("status");
const createBtn = document.getElementById("create");

function setStatus(text, kind) {
  statusEl.textContent = text || "";
  statusEl.className = "status" + (kind ? " " + kind : "");
}

createBtn.addEventListener("click", () => {
  const name = document.getElementById("qr_name").value.trim();
  const category = categorySelect.value;
  const qr_type = document.getElementById("qr_type").value;
  const type = currentType();

  if (!name) { setStatus("Name is required", "error"); return; }

  const data = {};
  for (const input of fieldsEl.querySelectorAll("[data-key]")) {
    data[input.dataset.key] = input.value;
  }

  createBtn.disabled = true;
  setStatus("Creating…");
  Bridge.callTool("create_qr_code", {
    params: { name, category, qr_type, info: { type, data } },
  })
    .then((envelope) => {
      if (envelope && envelope.ok === false) {
        setStatus((envelope.error && envelope.error.message) || JSON.stringify(envelope.error) || "Failed to create QR code", "error");
        return;
      }
      setStatus("QR code “" + name + "” created", "success");
    })
    .catch(() => setStatus("Could not reach the host to create the QR code", "error"))
    .finally(() => { createBtn.disabled = false; });
});
</script>
</body>
</html>
