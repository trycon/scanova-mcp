<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none';" />
<title>Folders</title>
<style>
  :root {
    --bg: #ffffff; --fg: #1b1f23; --muted: #6b7280; --border: #e2e5e9;
    --accent: #2d6cdf; --danger: #c0392b; --success: #1e824c; --radius: 8px; --row-hover: #f4f6f8;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #15181d; --fg: #e7e9ec; --muted: #9aa3ad; --border: #2b2f36; --accent: #6ea2ff; --row-hover: #1e2229; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--fg); font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .toolbar { display: flex; gap: 8px; margin-bottom: 12px; align-items: center; }
  select, input[type="text"] { padding: 7px 9px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--fg); }
  table { width: 100%; border-collapse: collapse; margin-bottom: 16px; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--border); font-size: 13px; }
  th { color: var(--muted); font-weight: 600; }
  tr:hover td { background: var(--row-hover); }
  tr.selected td { background: var(--row-hover); }
  td.actions { white-space: nowrap; }
  button { padding: 6px 10px; border: none; border-radius: var(--radius); background: var(--accent); color: #fff; font-weight: 600; cursor: pointer; font-size: 12px; }
  button.link { background: none; color: var(--accent); text-decoration: underline; padding: 0; font-weight: 500; }
  button.danger { background: var(--danger); }
  button:disabled { opacity: 0.4; cursor: default; }
  .empty { color: var(--muted); text-align: center; padding: 20px 0; }
  .status { margin-top: 8px; font-size: 12px; color: var(--muted); min-height: 16px; }
  .error { color: var(--danger); }
  .success { color: var(--success); }
  fieldset { border: 1px solid var(--border); border-radius: var(--radius); margin-top: 16px; padding: 12px; }
  legend { padding: 0 6px; color: var(--muted); font-size: 12px; }
  .row { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }
  .row label { flex: 0 0 90px; color: var(--muted); font-size: 12px; }
  .row input { flex: 1; }

  /* Deliberately unskippable confirmation — Part 8: a shared component,
     no "don't ask again" affordance, regardless of which destructive tool
     triggers it. */
  .confirm-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,0.4);
    display: flex; align-items: center; justify-content: center;
  }
  .confirm-box { background: var(--bg); color: var(--fg); border-radius: var(--radius); padding: 16px; width: 280px; }
  .confirm-box .row label { flex: 0 0 auto; }
  .confirm-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }
</style>
</head>
<body>

<div class="toolbar">
  <label for="folder_type">Type</label>
  <select id="folder_type">
    <option value="qr">QR codes</option>
    <option value="page">Pages</option>
  </select>
  <button id="refresh">Refresh</button>
</div>

<table>
  <thead><tr><th>Name</th><th>ID</th><th class="actions">Actions</th></tr></thead>
  <tbody id="rows"></tbody>
</table>
<div class="status" id="status"></div>

<fieldset>
  <legend>Move / unassign QR codes</legend>
  <div class="row"><label for="target_folder">Folder ID</label><input type="text" id="target_folder" placeholder="target folder id" /></div>
  <div class="row"><label for="qr_ids">QR IDs</label><input type="text" id="qr_ids" placeholder="comma-separated QR ids" /></div>
  <button id="move-btn">Move to folder</button>
  <button id="unassign-btn" class="link">Unassign from folder</button>
</fieldset>

<div id="modal-slot"></div>

<script>
const Bridge = (function () {
  if (window.openai && typeof window.openai.callTool === "function") {
    return { convention: "openai", callTool: (name, args) => window.openai.callTool(name, args) };
  }
  const pending = new Map();
  window.addEventListener("message", (event) => {
    const msg = event.data;
    if (!msg || typeof msg !== "object") return;
    if (msg.type === "tool-result" && pending.has(msg.requestId)) {
      const { resolve, reject } = pending.get(msg.requestId);
      pending.delete(msg.requestId);
      if (msg.error) reject(msg.error); else resolve(msg.result);
    }
  });
  return {
    convention: "postMessage",
    callTool: (name, args) =>
      new Promise((resolve, reject) => {
        const requestId = "req-" + Date.now() + "-" + Math.random().toString(36).slice(2);
        pending.set(requestId, { resolve, reject });
        window.parent.postMessage({ type: "tool-call", tool: name, args, requestId }, "*");
      }),
  };
})();

const rowsEl = document.getElementById("rows");
const statusEl = document.getElementById("status");
const modalSlot = document.getElementById("modal-slot");

function setStatus(text, kind) {
  statusEl.textContent = text || "";
  statusEl.className = "status" + (kind ? " " + kind : "");
}

function handleEnvelope(envelope, onOk) {
  if (envelope && envelope.ok === false) {
    setStatus((envelope.error && envelope.error.message) || JSON.stringify(envelope.error) || "Request failed", "error");
    return;
  }
  onOk(envelope.data);
}

function renderRows(folders) {
  rowsEl.innerHTML = "";
  if (!folders || !folders.length) {
    rowsEl.innerHTML = '<tr><td colspan="3" class="empty">No folders yet</td></tr>';
    return;
  }
  for (const folder of folders) {
    const tr = document.createElement("tr");
    tr.innerHTML =
      '<td><input type="text" data-rename-for="' + folder.id + '" value="' + (folder.name || "").replace(/"/g, "&quot;") + '" /></td>' +
      "<td>" + folder.id + "</td>" +
      '<td class="actions">' +
        '<button class="link" data-save="' + folder.id + '">Save</button> ' +
        '<button class="danger" data-delete="' + folder.id + '">Delete</button>' +
      "</td>";
    rowsEl.appendChild(tr);
  }
}

function load() {
  setStatus("Loading…");
  const folder_type = document.getElementById("folder_type").value;
  Bridge.callTool("list_folders", { folder_type })
    .then((envelope) => handleEnvelope(envelope, (data) => { renderRows(data.results || data); setStatus(""); }))
    .catch(() => setStatus("Could not reach the host", "error"));
}

document.getElementById("refresh").addEventListener("click", load);
document.getElementById("folder_type").addEventListener("change", load);

rowsEl.addEventListener("click", (event) => {
  const saveId = event.target.dataset.save;
  const deleteId = event.target.dataset.delete;
  if (saveId) {
    const input = rowsEl.querySelector('[data-rename-for="' + saveId + '"]');
    setStatus("Saving…");
    Bridge.callTool("update_folder", { folder_id: Number(saveId), name: input.value })
      .then((envelope) => handleEnvelope(envelope, () => setStatus("Renamed", "success")))
      .catch(() => setStatus("Could not reach the host", "error"));
  }
  if (deleteId) {
    showDeleteConfirm(Number(deleteId));
  }
});

// Confirmation Dialog — mirrors the tool description's own requirement
// ("do not proceed without explicit user confirmation of the desired
// behavior") for delete_folder's move-vs-permanently-delete choice.
function showDeleteConfirm(folderId) {
  modalSlot.innerHTML =
    '<div class="confirm-backdrop"><div class="confirm-box">' +
    "<p>Delete this folder?</p>" +
    '<div class="row"><label><input type="radio" name="delete-mode" value="move" checked /> Move QR codes to Uncategorized</label></div>' +
    '<div class="row"><label><input type="radio" name="delete-mode" value="permanent" /> Delete QR codes permanently too</label></div>' +
    '<div class="confirm-actions"><button class="link" id="confirm-cancel">Cancel</button><button class="danger" id="confirm-ok">Delete</button></div>' +
    "</div></div>";

  document.getElementById("confirm-cancel").addEventListener("click", () => { modalSlot.innerHTML = ""; });
  document.getElementById("confirm-ok").addEventListener("click", () => {
    const mode = modalSlot.querySelector('input[name="delete-mode"]:checked').value;
    modalSlot.innerHTML = "";
    setStatus("Deleting…");
    Bridge.callTool("delete_folder", {
      folder_id: folderId,
      move_to_uncategorized: mode === "move",
      delete_permanently: mode === "permanent",
    })
      .then((envelope) => handleEnvelope(envelope, () => { setStatus("Folder deleted", "success"); load(); }))
      .catch(() => setStatus("Could not reach the host", "error"));
  });
}

function parseIds(text) {
  return text.split(",").map((s) => s.trim()).filter(Boolean);
}

document.getElementById("move-btn").addEventListener("click", () => {
  const folder_id = Number(document.getElementById("target_folder").value);
  const qr_code_ids = parseIds(document.getElementById("qr_ids").value);
  if (!folder_id || !qr_code_ids.length) { setStatus("Folder ID and at least one QR ID are required", "error"); return; }
  setStatus("Moving…");
  Bridge.callTool("move_qr_codes_to_folder", { folder_id, qr_code_ids })
    .then((envelope) => handleEnvelope(envelope, () => setStatus("Moved " + qr_code_ids.length + " QR code(s)", "success")))
    .catch(() => setStatus("Could not reach the host", "error"));
});

document.getElementById("unassign-btn").addEventListener("click", () => {
  const folder_id = Number(document.getElementById("target_folder").value);
  const qr_code_ids = parseIds(document.getElementById("qr_ids").value);
  if (!folder_id || !qr_code_ids.length) { setStatus("Folder ID and at least one QR ID are required", "error"); return; }
  setStatus("Unassigning…");
  Bridge.callTool("unassign_qr_codes_from_folder", { folder_id, qr_code_ids })
    .then((envelope) => handleEnvelope(envelope, () => setStatus("Unassigned " + qr_code_ids.length + " QR code(s)", "success")))
    .catch(() => setStatus("Could not reach the host", "error"));
});

load();
</script>
</body>
</html>
